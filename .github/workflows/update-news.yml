name: Update news

on:
  workflow_dispatch:
  push:
    paths:
      - "fetch_news.py"
      - ".github/workflows/update-news.yml"
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_run:
    workflows: ["Update breaking news"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: international-news
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install social link resolver
        continue-on-error: true
        run: python -m pip install "googlenewsdecoder==0.2.2"
      - name: Refresh repository before collection
        run: git pull --ff-only origin main
      - name: Collect international news
        env:
          RECOVERY_RUN: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
        run: |
          if [ "$RECOVERY_RUN" = "1" ]; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          data = json.loads(Path("news.json").read_text())
          age = (datetime.now(timezone.utc) - datetime.fromisoformat(data["updated_at"])).total_seconds()
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("SKIP_RECOVERY=" + ("1" if age < 600 else "0") + "\n")
          PY
          fi
      - name: Update international news when due
        if: env.SKIP_RECOVERY != '1'
        run: python fetch_news.py
      - name: Save updated database
        run: |
          git config user.name "vatican-media-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update news feed"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push; then exit 0; fi
          done
          exit 1
