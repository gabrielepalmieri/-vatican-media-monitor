name: Update news

on:
  workflow_dispatch:
  push:
    paths:
      - "fetch_news.py"
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect international news
        run: python fetch_news.py
      - name: Save updated database
        run: |
          git config user.name "vatican-media-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update news feed"
          git push
