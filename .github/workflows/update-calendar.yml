name: Update daily calendar

on:
  workflow_dispatch:
  push:
    paths:
      - "fetch_calendar.py"
      - ".github/workflows/update-calendar.yml"
  schedule:
    - cron: "10 5,22 * * *"

permissions:
  contents: write

concurrency:
  group: daily-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official daily observances
        run: python fetch_calendar.py
      - name: Save daily calendar
        run: |
          git config user.name "vatican-media-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendar.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update daily observances"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push; then exit 0; fi
          done
          exit 1
